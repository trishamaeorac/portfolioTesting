<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/panda.css' %}"> 
</head>
<body>
    <!-- Header Section with Navigation -->
    <header>
        <nav>
            <a href="{% url 'home' %}" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
            <a href="{% url 'projects' %}" {% if request.path == '/projects/' %}class="active"{% endif %}>Projects</a>
            <a href="{% url 'contact' %}" {% if request.path == '/contact/' %}class="active"{% endif %}>Contact</a>
        </nav>
        {% if request.path != '/contact/' %}
            <h1>Contact</h1>
        {% endif %}
    </header>

    <!-- Contact Section Content -->
        <section class="contact">
        <!-- Success Message Placeholder -->
        <div id="success-message" style="display:none; color: green; margin-bottom: 20px;">
            Your message has been sent successfully!
        </div>

        <h2>Get in Touch</h2>
        <form id="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" required></textarea><br><br>

            <button type="submit">Send</button>
        </form>
    </section>

    <!-- Panda Animation Section -->
<div class="panda-container">
    <div class="panda">
        <div class="panda-head"></div>
        <div class="panda-eye left"></div>
        <div class="panda-eye right"></div>
        <div class="panda-ear left"></div>
        <div class="panda-ear right"></div>
        <div class="panda-body"></div>
        <div class="panda-leg left"></div>
        <div class="panda-leg right"></div>
        <div class="panda-arm left"></div>
        <div class="panda-arm right"></div>
    </div>
    <div class="panda">
        <div class="panda-head"></div>
        <div class="panda-eye left"></div>
        <div class="panda-eye right"></div>
        <div class="panda-ear left"></div>
        <div class="panda-ear right"></div>
        <div class="panda-body"></div>
        <div class="panda-leg left"></div>
        <div class="panda-leg right"></div>
        <div class="panda-arm left"></div>
        <div class="panda-arm right"></div>
    </div>
    <div class="panda">
        <div class="panda-head"></div>
        <div class="panda-eye left"></div>
        <div class="panda-eye right"></div>
        <div class="panda-ear left"></div>
        <div class="panda-ear right"></div>
        <div class="panda-body"></div>
        <div class="panda-leg left"></div>
        <div class="panda-leg right"></div>
        <div class="panda-arm left"></div>
        <div class="panda-arm right"></div>
    </div>
</div>

    <!-- Link to the JavaScript file -->
    <script src="{% static 'js/contact.js' %}"></script>
</body>
</html>
